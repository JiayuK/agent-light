name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build release zip
        shell: pwsh
        run: ./scripts/build-app-win.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-light-windows-x64
          path: dist/agent-light-*-windows-x64.zip
