name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build release zip
        shell: pwsh
        run: ./scripts/build-app-win.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-light-windows-x64
          path: dist/agent-light-*-windows-x64.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-ChildItem dist/agent-light-*-windows-x64.zip | Select-Object -First 1
          if (-not $zip) {
            throw "Windows zip not found in dist/"
          }

          # macOS release assets are uploaded locally; wait for the release to exist.
          for ($i = 0; $i -lt 30; $i++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Waiting for release $tag ..."
            Start-Sleep -Seconds 10
          }

          gh release upload $tag $zip.FullName --clobber
